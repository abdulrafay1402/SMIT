<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Flipper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .display-box {
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 40px;
            margin-bottom: 30px;
            min-width: 300px;
        }

        .color-text {
            color: white;
            font-size: 3em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .page-indicator {
            color: white;
            font-size: 1.2em;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        button {
            background-color: white;
            color: #333;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #f0f0f0;
        }

        button:active {
            transform: scale(0.98);
        }

        .nav-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Color Flipper</h1>
        <div class="page-indicator">Page <span id="pageNum">1</span></div>
        <div class="display-box">
            <div class="color-text" id="colorDisplay">#FF6B6B</div>
        </div>
        <button onclick="changeColor()">Change Color</button>
        <div class="nav-buttons">
            <a href="index.html"><button>Color Names</button></a>
            <a href="hex.html"><button>HEX Codes</button></a>
        </div>
    </div>
    <script src="app2.js"></script>
</body>
</html>
