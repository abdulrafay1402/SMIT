<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student ID Card Generator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
     <body>
    <div class="container-main">
      <div class="form-container">
        <h1>Student ID Card</h1>

        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            class="fullName"
            placeholder="Enter your full name"
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            class="email"
            placeholder="your.email@example.com"
          />
        </div>

        <div class="form-group">
          <label for="course">Course Name</label>
          <input
            type="text"
            id="course"
            class="studentCourseName"
            placeholder="Enter your course name"
          />
        </div>

        <div class="form-group">
          <label for="rollNum">Roll Number</label>
          <input
            type="number"
            id="rollNum"
            class="rollNumber"
            placeholder="e.g., 2401"
          />
        </div>



        <div class="form-group">
          <label for="profileImage">Profile Photo</label>
          <div class="file-input-wrapper">
            <input
              type="file"
              id="profileImage"
              class="studentImage"
              accept="image/*"
            />
            <label for="profileImage" class="file-input-label">
              📷 Click to upload or drag image here
            </label>
            <div class="file-name" id="fileName"></div>
          </div>
        </div>

        <button onclick="handleFormSubmit()" class="btn-generate">
          Generate ID Card
        </button>
      </div>

      <div
        class="id-card-container"
        id="cardContainer"
        style="display: none"
      ></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
